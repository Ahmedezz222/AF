[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolka"
version = "0.1.1"
description = "Read-only APFS driver for Windows in pure Python: mounts Mac disks and Time Machine backups via built-in WebDAV"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Olga Ivchenko", email = "novaalela@gmail.com" }]
requires-python = ">=3.10"
keywords = ["apfs", "time-machine", "webdav", "forensics", "data-recovery", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Recovery Tools",
]

[project.scripts]
yolka = "yolka.cli:main"
yolka-dav = "yolka.dav:main"

[project.gui-scripts]
yolka-gui = "yolka.gui:main"

[tool.setuptools]
packages = ["yolka"]
